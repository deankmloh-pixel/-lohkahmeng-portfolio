<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AEGIS — Attrition Target List</title>
<style>
  :root{--ink:#e8eef5;--bg:#0f1720;--card:#16212e;--muted:#93a4b8;--line:#26374a;--accent:#5a9fd4;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',-apple-system,system-ui,sans-serif;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden;padding:10px 14px;gap:8px;}
  .top{display:flex;align-items:center;justify-content:space-between;}
  .brand{font-size:18px;font-weight:800;}.brand span{color:var(--accent);}
  .topright{display:flex;align-items:center;gap:10px;}
  select.role{font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#1b2836;color:var(--ink);cursor:pointer;}
  .exp{font-size:12.5px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:8px;padding:8px 15px;cursor:pointer;}
  .exp:disabled{background:#2f4256;cursor:not-allowed;}
  .pill{font-weight:800;border-radius:12px;white-space:nowrap;display:inline-block;}
  .p-sm{font-size:11px;padding:2px 11px;}
  .b-l{background:#2e9e4f;color:#fff;} .b-m{background:#f2c94c;color:#5a4a00;}
  .b-h{background:#ef8b3b;color:#fff;} .b-vh{background:#d64550;color:#fff;}
  /* DISPLAY */
  .card{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;
        box-shadow:0 6px 20px rgba(26,35,50,.06);display:flex;flex-direction:column;overflow:hidden;}
  .summary{padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #f0f2f7;}
  .summary .m{font-size:13px;color:var(--muted);} .summary .m b{color:var(--ink);font-size:16px;}
  .tablewrap{flex:1;overflow:auto;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{position:sticky;top:0;background:#1b2836;text-align:left;padding:7px 16px;font-size:10px;
           text-transform:uppercase;letter-spacing:.4px;color:var(--muted);border-bottom:1px solid var(--line);}
  tbody td{padding:6px 16px;border-bottom:1px solid #f0f2f7;}
  tbody tr:hover{background:#1f2c3a;}
  .idcell{color:var(--muted);font-variant-numeric:tabular-nums;} .rolecell{font-weight:600;}
  /* STATUS = last row of the display */
  .cardfoot{border-top:1px solid var(--line);background:#1f2c3a;padding:10px 16px;
            display:grid;grid-template-columns:repeat(7,1fr);gap:9px 14px;align-content:center;min-height:82px;}
  .scell{display:flex;align-items:baseline;gap:5px;font-size:10px;line-height:1.25;min-width:0;white-space:nowrap;overflow:hidden;}
  .sname{font-weight:800;color:#0d1420;flex-shrink:0;}
  .sval{font-style:italic;font-weight:700;color:#7c3aed;overflow:hidden;text-overflow:ellipsis;}
  .sval-none{font-style:italic;color:#aab1bf;}
  .statusnone{grid-column:1 / -1;font-size:12px;font-style:italic;color:#9aa3b2;align-self:center;}
  .sx{cursor:pointer;font-size:9px;margin-left:3px;flex-shrink:0;opacity:.75;}
  .chip{font-size:12px;background:#1b2836;border:1px solid #2f4256;border-radius:14px;padding:2px 8px 2px 10px;font-weight:600;}
  .chip b{color:var(--accent);} .chip .x{color:var(--muted);margin-left:5px;cursor:pointer;font-weight:700;}
  .none{font-size:12px;color:var(--muted);}
  /* INPUTS */
  .inputs{position:relative;display:flex;align-items:stretch;background:var(--card);
          border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 20px rgba(26,35,50,.06);padding:18px 30px;}
  .leftinputs{display:flex;gap:18px;align-items:flex-start;padding-right:26px;border-right:1px solid #e2e6ee;}
  .rightinputs{flex:1;display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding-left:26px;}
  .sliders{margin-left:75px;display:flex;flex-direction:column;gap:16px;}
  .fld{display:flex;flex-direction:column;gap:3px;}
  .fld label{font-size:10.5px;color:var(--muted);font-weight:600;}
  .fld select{padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#1b2836;color:var(--ink);}
  #paramSel{width:215px;} #valSel{width:245px;}
  .otbtn{align-self:flex-end;margin-bottom:2px;border:none;border-radius:9px;padding:9px 26px;font-size:15px;font-weight:800;color:#fff;cursor:pointer;letter-spacing:2px;}
  .ot-on{background:#2a6f97;}
  .ot-off{background:#6b7280;text-decoration:line-through;text-decoration-color:#ff4d4f;text-decoration-thickness:3px;}
  .sl{width:340px;max-width:340px;}
  .sl label{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:baseline;}
  .sl label b{color:var(--ink);font-size:13px;}
  .sl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:#2f4256;border-radius:3px;outline:none;margin-top:7px;}
  .sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);cursor:pointer;}
  .sl input[type=range]::-moz-range-thumb{width:15px;height:15px;border:none;border-radius:50%;background:var(--accent);cursor:pointer;}
.brand{display:flex;align-items:center;gap:9px;}
.brand-seal{height:30px;width:auto;display:block;}
.brand-accent{position:relative;}

  .sig-foot{display:flex;align-items:center;gap:12px;padding-top:6px;margin-top:2px;border-top:1px solid var(--line);flex-shrink:0;}
  .sig-foot .foot-mark{height:26px;width:auto;opacity:.95;display:block;}
  .sig-foot .foot-t{font-size:11.5px;color:var(--muted);}
  .sig-foot .foot-t i{color:var(--ink);font-style:italic;opacity:.9;}
  .app-badge{font-size:10.5px;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:1px 7px;white-space:nowrap;margin-left:10px;opacity:.9;}
</style>
</head>

const TRAVEL = {"Non-Travel":"None","Travel_Rarely":"Rarely","Travel_Frequently":"Frequently"};
const PARAMS = {
  "Department":                {col:"dept",  kind:"cat"},
  "Job Role":                  {col:"role",  kind:"cat"},
  "Business Travel":           {col:"travel",kind:"cat", vlab:TRAVEL},
  "Work-Life Balance":         {col:"wlb",   kind:"ord", labels:{1:"1 — Bad",2:"2 — Good",3:"3 — Better",4:"4 — Best"}},
  "Job Satisfaction":          {col:"jsat",  kind:"ord", labels:S4},
  "Environment Satisfaction":  {col:"esat",  kind:"ord", labels:S4},
  "Job Involvement":           {col:"invol", kind:"ord", labels:S4},
  "Job Level":                 {col:"lvl",   kind:"ord", labels:{1:"1 — Entry",2:"2",3:"3",4:"4",5:"5 — Senior"}},
  "Stock Option Level":        {col:"stock", kind:"ord", labels:{0:"0 — None",1:"1",2:"2",3:"3"}},
};
const state = {scope:[], ot:"yes", promo:0, dist:0, age:60, role:"mgmt"};
function band(p){
  if(p>=0.70) return {lab:"Very High", cls:"b-vh"};
  if(p>=0.50) return {lab:"High",      cls:"b-h"};
  if(p>=0.30) return {lab:"Medium",    cls:"b-m"};
  return              {lab:"Low",       cls:"b-l"};
}
const paramSel = document.getElementById("paramSel");
const valSel   = document.getElementById("valSel");
Object.keys(PARAMS).forEach(p=>{const o=document.createElement("option");o.value=p;o.textContent=p;paramSel.appendChild(o);});
function fillValues(){
  const p = PARAMS[paramSel.value]; valSel.innerHTML="";
  const ph=document.createElement("option"); ph.value=""; ph.textContent="— select a value —"; ph.disabled=true; ph.selected=true; valSel.appendChild(ph);
  let opts = p.kind==="cat"
    ? [...new Set(DATA.map(r=>r[p.col]))].sort().map(v=>[v, (p.vlab&&p.vlab[v])||v])
    : Object.keys(p.labels).map(k=>[isNaN(+k)?k:+k, p.labels[k]]);
  opts.forEach(([raw,lab])=>{const o=document.createElement("option");o.value=String(raw);o.textContent=lab;o.dataset.lab=lab;valSel.appendChild(o);});
}
paramSel.addEventListener("change", fillValues);
fillValues();
function currentRows(){
  return DATA.filter(r=>{
    for(const s of state.scope){ if(String(r[s.col])!==String(s.raw)) return false; }
    if(state.ot==="yes" && r.ot!=="Yes") return false;
    if(state.ot==="no"  && r.ot!=="No")  return false;
    if(r.promo < state.promo) return false;
    if(r.dist  < state.dist)  return false;
    if(r.age   > state.age)   return false;
    return true;
  });
}
function render(){
  const rows = currentRows().slice().sort((a,b)=>b.risk-a.risk);
  const sum = document.getElementById("summary");
  sum.innerHTML = rows.length
    ? `<span class="m"><b>${rows.length}</b> employees in this list</span>`
    : `<span class="m">No records match — remove a filter.</span>`;
  document.getElementById("tbody").innerHTML = rows.map(r=>{
    const b = band(r.risk);
    return `<tr><td class="idcell">${r.id}</td><td class="rolecell">${r.role}</td>`+
      `<td>${r.ot==="Yes"?"Yes":"—"}</td><td>${SATW[r.jsat]}</td>`+
      `<td>${r.promo} yr</td><td>${TRAVEL[r.travel]||r.travel}</td>`+
      `<td><span class="pill p-sm ${b.cls}">${b.lab}</span></td></tr>`;
  }).join("");
  const st = document.getElementById("status");
  const order = Object.keys(PARAMS);
  const sel = order.filter(p=>state.scope.some(s=>s.param===p)).map(p=>state.scope.find(s=>s.param===p));
  st.innerHTML = sel.length
    ? sel.map(s=>`<div class="scell"><span class="sname">${s.param}</span><span class="sval">${s.label}</span><span class="sx" data-p="${s.param}">❌</span></div>`).join("")
    : `<div class="statusnone">nothing selected yet — pick a Parameter and Value</div>`;
  st.querySelectorAll(".sx").forEach(x=>x.addEventListener("click",()=>{
    state.scope = state.scope.filter(s=>s.param!==x.dataset.p); render();
  }));
}
function applyParam(){
  if(valSel.value==="") return;
  const p = PARAMS[paramSel.value];
  const opt = valSel.options[valSel.selectedIndex];
  state.scope = state.scope.filter(s=>s.col!==p.col);
  state.scope.push({param:paramSel.value, col:p.col, raw:valSel.value, label:opt.dataset.lab});
  valSel.selectedIndex = 0;
  render();
}
valSel.addEventListener("change", applyParam);
const otBtn=document.getElementById("otBtn");
otBtn.addEventListener("click",()=>{
  state.ot = state.ot==="yes" ? "no" : "yes";
  otBtn.className = "otbtn "+(state.ot==="yes"?"ot-on":"ot-off");
  render();
});
function slider(id,labId,key,fmt){
  const el=document.getElementById(id), lab=document.getElementById(labId);
  el.addEventListener("input",()=>{state[key]=+el.value;lab.textContent=fmt(+el.value);render();});
}
slider("promoSl","promoLab","promo",v=>String(v));
slider("distSl","distLab","dist",v=>v+" km");
slider("ageSl","ageLab","age",v=>String(v));
const expBtn = document.getElementById("expBtn");
document.getElementById("role").addEventListener("change",e=>{
  state.role=e.target.value;
  expBtn.disabled = (state.role!=="mgmt");
  expBtn.textContent = state.role==="mgmt" ? "⬇ Export list (CSV)" : "Export — Management only";
});
expBtn.addEventListener("click",()=>{
  if(state.role!=="mgmt") return;
  const rows = currentRows();
  const head = ["EmployeeID","JobRole","Overtime","JobSatisfaction","YrsSincePromotion","BusinessTravel","RiskLevel"];
  const lines = [head.join(",")].concat(rows.map(r=>
    [r.id,`"${r.role}"`,r.ot,SATW[r.jsat],r.promo,(TRAVEL[r.travel]||r.travel),band(r.risk).lab].join(",")));
  const blob = new Blob([lines.join("\n")],{type:"text/csv"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="attrition_target_list.csv"; a.click();
});
render();
</script>
